<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Eco Farm 4.0</title>
<style>
  :root {
    --bg: #eef4fa;
    --card: #ffffff;
    --border: #dde6f0;
    --text: #1e293b;
    --muted: #64748b;
    --red: #e53935;
    --blue: #1e88e5;
    --cyan: #00acc1;
    --green: #43a047;
    --amber: #fb8c00;
    --brown: #8d6e63;
    --radius: 22px;
    --shadow: 0 6px 20px rgba(30, 64, 120, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px 40px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* Heading */
  header { text-align: center; margin-bottom: 22px; }
  h1 {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 2.3rem; font-weight: 800; letter-spacing: .5px; color: #1b5e20;
  }
  h1 svg { width: 40px; height: 40px; }
  .sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }

  /* Control bar */
  .controls {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin-bottom: 22px;
  }
  .field { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  select, input[type=number], input[type=text] {
    font: inherit; color: var(--text); background: #f8fafc;
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; outline: none;
  }
  select:focus, input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,136,229,.15); }
  input[type=number] { width: 84px; }
  button {
    font: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 20px;
    cursor: pointer; color: #fff; transition: transform .1s, filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-connect { background: var(--green); }
  .btn-disconnect { background: var(--red); }
  .btn-ghost { background: #eef2f7; color: var(--text); border: 1px solid var(--border); }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; color: var(--muted); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #b0bec5; }
  .status.on { color: var(--green); }
  .status.on .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(67,160,71,.2); }

  /* Sensor cards */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 22px; }
  .card {
    position: relative; overflow: hidden; aspect-ratio: 1 / 1;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card > * { position: relative; z-index: 1; }
  .card-top { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--muted); font-size: .95rem; }
  .icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; }
  .value { font-size: 2.7rem; font-weight: 800; line-height: 1; }
  .value small { font-size: 1.15rem; font-weight: 700; color: var(--muted); margin-left: 2px; }
  .state { font-weight: 700; font-size: .95rem; }
  .bar { height: 10px; background: #e8eef5; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .5s ease; }
  .extra { font-size: .8rem; color: var(--muted); height: 1.1em; }

  .c-temp  .icon { background: #fdecea; color: var(--red); }   .c-temp  .value, .c-temp  .state { color: var(--red); }   .c-temp  .bar i { background: var(--red); }
  .c-hum   .icon { background: #e3f2fd; color: var(--blue); }  .c-hum   .value, .c-hum   .state { color: var(--blue); }  .c-hum   .bar i { background: var(--blue); }
  .c-water .icon { background: #e0f7fa; color: var(--cyan); }  .c-water .value, .c-water .state { color: var(--cyan); }  .c-water .bar i { background: var(--cyan); }
  .c-soil  .icon { background: #efebe9; color: var(--brown); } .c-soil  .value, .c-soil  .state { color: var(--brown); } .c-soil  .bar i { background: var(--brown); }

  .tankfill {
    position: absolute !important; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(180deg, rgba(0,172,193,.10), rgba(0,172,193,.22));
    transition: height .6s ease; z-index: 0 !important;
  }

  /* Serial monitor */
  .monitor {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px;
  }
  .mon-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mon-head h2 { font-size: 1.1rem; font-weight: 800; flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  #log {
    height: 260px; overflow-y: auto; background: #0f172a; color: #d6e2f0; border-radius: 14px;
    padding: 12px 14px; font: 13px/1.55 Consolas, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  }
  #log .ts { color: #64748b; margin-right: 8px; }
  #log .tx { color: #ffd54f; }
  #log .sys { color: #4dd0e1; }
  #log .err { color: #ff8a80; }
  .send { display: flex; gap: 10px; margin-top: 12px; }
  .send input { flex: 1; }
  .send button { background: var(--blue); }

  .warn {
    display: none; background: #fff3e0; border: 1px solid #ffcc80; color: #8a4b00;
    padding: 12px 16px; border-radius: 14px; margin-bottom: 20px; font-weight: 600; text-align: center;
  }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
    .value { font-size: 2.2rem; }
    .grid { gap: 12px; } .card { padding: 14px; }
    .spacer { display: none; }
  }

  /* Phone layout */
  @media (max-width: 600px) {
    body { padding: calc(14px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 1.9rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; padding: 14px; gap: 10px; }
    .controls .field { grid-column: 1 / -1; justify-content: space-between; }
    .controls .field select, .controls .field input { width: 55%; }
    .controls #btnDemo, .controls .status { grid-column: 1 / -1; }
    .controls .status { justify-content: center; }
    .card-top { font-size: .82rem; gap: 8px; }
    .icon { width: 32px; height: 32px; border-radius: 10px; }
    .icon svg { width: 19px; height: 19px; }
    .state { font-size: .85rem; }
    #log { height: 220px; }
    .mon-head h2 { flex: 1 1 100%; }
    .mon-head .btn-ghost { margin-left: auto; padding: 8px 16px; }
    .send { flex-wrap: wrap; }
    .send input { flex: 1 1 100%; }
    .send select { flex: 1; }
    .send button { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.5 5-7"/></svg>
      Eco Farm 4.0
    </h1>
    <div class="sub">Smart Farm Serial Monitor</div>
  </header>

  <div class="warn" id="warn">Web Serial is not supported in this browser. Please open this file in Google Chrome or Microsoft Edge.</div>

  <!-- Controls -->
  <div class="controls">
    <label class="field">Baud rate
      <select id="baud">
        <option>300</option><option>1200</option><option>2400</option><option>4800</option>
        <option selected>9600</option><option>19200</option><option>38400</option>
        <option>57600</option><option>115200</option><option>230400</option>
      </select>
    </label>
    <button class="btn-connect" id="btnConnect">Connect</button>
    <button class="btn-disconnect" id="btnDisconnect" disabled>Disconnect</button>
    <label class="field">Tank height (cm)
      <input type="number" id="tankH" value="100" min="5" max="1000">
    </label>
    <button class="btn-ghost" id="btnDemo">Demo</button>
    <div class="spacer"></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Disconnected</span></div>
  </div>

  <!-- Sensor cards -->
  <div class="grid">
    <div class="card c-temp">
      <div class="card-top"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></div>Temperature</div>
      <div><div class="value"><span id="tempV">--</span><small>°C</small></div><div class="bar"><i id="tempB"></i></div></div>
      <div><div class="state" id="tempS">Waiting…</div><div class="extra" id="tempX"></div></div>
    </div>

    <div class="card c-hum">
      <div class="card-top"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 6.2 6 10.8a6 6 0 0 1-12 0C6 8.9 12 2.7 12 2.7z"/></svg></div>Humidity</div>
      <div><div class="value"><span id="humV">--</span><small>%</small></div><div class="bar"><i id="humB"></i></div></div>
      <div><div class="state" id="humS">Waiting…</div><div class="extra" id="humX"></div></div>
    </div>

    <div class="card c-water">
      <div class="tankfill" id="tankFill"></div>
      <div class="card-top"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c2 0 2-1.5 4.5-1.5S10 8 12 8s2.5-1.5 4.5-1.5S19 8 21 8"/><path d="M3 14c2 0 2-1.5 4.5-1.5S10 14 12 14s2.5-1.5 4.5-1.5S19 14 21 14"/><path d="M5 3h14v18H5z" opacity=".5"/></svg></div>Water Tank</div>
      <div><div class="value"><span id="waterV">--</span><small>%</small></div><div class="bar"><i id="waterB"></i></div></div>
      <div><div class="state" id="waterS">Waiting…</div><div class="extra" id="waterX"></div></div>
    </div>

    <div class="card c-soil">
      <div class="card-top"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-9"/><path d="M12 13c0-4 2.5-6.5 7-6.5 0 4-2.5 6.5-7 6.5z"/><path d="M12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/><path d="M4 22h16"/></svg></div>Soil Condition</div>
      <div><div class="value"><span id="soilV">--</span><small>%</small></div><div class="bar"><i id="soilB"></i></div></div>
      <div><div class="state" id="soilS">Waiting…</div><div class="extra" id="soilX">Moisture</div></div>
    </div>
  </div>

  <!-- Serial monitor -->
  <div class="monitor">
    <div class="mon-head">
      <h2>Serial Monitor</h2>
      <label class="check"><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
      <label class="check"><input type="checkbox" id="timestamp" checked> Timestamp</label>
      <button class="btn-ghost" id="btnClear">Clear</button>
    </div>
    <div id="log"></div>
    <form class="send" id="sendForm">
      <input type="text" id="sendText" placeholder="Type a message to send to Arduino…" autocomplete="off" disabled>
      <select id="lineEnd" title="Line ending">
        <option value="nl">Newline</option><option value="crnl">CR + NL</option><option value="none">None</option>
      </select>
      <button type="submit" id="btnSend" disabled>Send</button>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log');
let port = null, reader = null, writer = null, keepReading = false, demoTimer = null, buffer = '';

const NATIVE = typeof window.Android !== 'undefined';
const LE = { nl: '\n', crnl: '\r\n', none: '' };
if (!NATIVE && !('serial' in navigator)) $('warn').style.display = 'block';

/* ---------- Monitor ---------- */
function addLine(text, cls = '') {
  const row = document.createElement('div');
  if ($('timestamp').checked) {
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = new Date().toLocaleTimeString([], { hour12: false });
    row.appendChild(ts);
  }
  const t = document.createElement('span');
  if (cls) t.className = cls;
  t.textContent = text;
  row.appendChild(t);
  log.appendChild(row);
  while (log.childElementCount > 500) log.removeChild(log.firstChild);
  if ($('autoscroll').checked) log.scrollTop = log.scrollHeight;
}

function setStatus(on, text) {
  $('status').classList.toggle('on', on);
  $('statusText').textContent = text;
  $('btnConnect').disabled = on;
  $('btnDisconnect').disabled = !on;
  $('baud').disabled = on;
  $('sendText').disabled = !on;
  $('btnSend').disabled = !on;
}

/* ---------- Serial ---------- */
async function connect() {
  stopDemo();
  if (NATIVE) { Android.connect(parseInt($('baud').value, 10)); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: parseInt($('baud').value, 10) });
  } catch (e) {
    if (e.name !== 'NotFoundError') addLine('Connection failed: ' + e.message, 'err');
    port = null; return;
  }
  setStatus(true, 'Connected @ ' + $('baud').value);
  addLine('Connected at ' + $('baud').value + ' baud', 'sys');
  keepReading = true;
  writer = port.writable.getWriter();
  readLoop();
}

async function readLoop() {
  const decoder = new TextDecoder();
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.search(/\r?\n/)) >= 0) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx).replace(/^\r?\n/, '');
          if (line.trim()) handleLine(line.trim());
        }
      }
    } catch (e) {
      if (keepReading) addLine('Read error: ' + e.message, 'err');
    } finally {
      reader.releaseLock();
    }
  }
}

async function disconnect() {
  if (NATIVE) { Android.disconnect(); return; }
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch (_) {}
  try { if (writer) { writer.releaseLock(); } } catch (_) {}
  try { if (port) await port.close(); } catch (_) {}
  port = reader = writer = null; buffer = '';
  setStatus(false, 'Disconnected');
  addLine('Disconnected', 'sys');
}

async function sendText(text) {
  if (NATIVE) { Android.send(text + LE[$('lineEnd').value]); addLine('» ' + text, 'tx'); return; }
  if (!writer) return;
  const data = new TextEncoder().encode(text + LE[$('lineEnd').value]);
  await writer.write(data);
  addLine('» ' + text, 'tx');
}

/* ---------- Parsing ---------- */
function handleLine(line) {
  addLine(line);
  const d = parseLine(line);
  if (d) updateSensors(d);
}

function parseLine(line) {
  const out = {};
  const assign = (k, v) => {
    k = String(k).toLowerCase().trim();
    v = parseFloat(v);
    if (isNaN(v)) return;
    if (/^t(emp(erature)?)?$/.test(k)) out.temp = v;
    else if (/^h(um(idity)?)?$/.test(k)) out.hum = v;
    else if (/^(w|water|level|tank)$/.test(k)) out.level = v;
    else if (/^(d|dist|distance|us|ultrasonic)$/.test(k)) out.dist = v;
    else if (/^(s|soil|moisture|soilmoisture)$/.test(k)) out.soil = v;
  };
  if (line.startsWith('{')) {
    try { Object.entries(JSON.parse(line)).forEach(([k, v]) => assign(k, v)); } catch (_) {}
  } else {
    const re = /([A-Za-z_]+)\s*[:=]\s*(-?\d+(?:\.\d+)?)/g; let m;
    while ((m = re.exec(line))) assign(m[1], m[2]);
  }
  return Object.keys(out).length ? out : null;
}

/* ---------- Dashboard ---------- */
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
function setCard(id, valueText, pct, stateText, color, extra) {
  $(id + 'V').textContent = valueText;
  $(id + 'B').style.width = clamp(pct) + '%';
  $(id + 'S').textContent = stateText;
  $(id + 'S').style.color = color;
  if (extra !== undefined) $(id + 'X').textContent = extra;
}

function updateSensors(d) {
  if ('temp' in d) {
    const t = d.temp;
    const s = t < 15 ? ['Cool', '#1e88e5'] : t < 30 ? ['Normal', '#43a047'] : t < 38 ? ['Warm', '#fb8c00'] : ['Hot', '#e53935'];
    setCard('temp', t.toFixed(1), (t / 50) * 100, s[0], s[1], (t * 9 / 5 + 32).toFixed(1) + ' °F');
  }
  if ('hum' in d) {
    const h = d.hum;
    const s = h < 30 ? ['Dry', '#fb8c00'] : h < 60 ? ['Comfortable', '#43a047'] : h < 80 ? ['Humid', '#1e88e5'] : ['Very Humid', '#e53935'];
    setCard('hum', h.toFixed(1), h, s[0], s[1]);
  }
  if ('level' in d || 'dist' in d) {
    let pct, extra = '';
    if ('level' in d) pct = d.level;
    else {
      const H = parseFloat($('tankH').value) || 100;
      pct = (1 - d.dist / H) * 100;
      extra = 'Distance: ' + d.dist.toFixed(1) + ' cm';
    }
    pct = clamp(pct);
    const s = pct < 20 ? ['Low – Refill!', '#e53935'] : pct < 50 ? ['Medium', '#fb8c00'] : ['Good', '#00acc1'];
    setCard('water', pct.toFixed(0), pct, s[0], s[1], extra);
    $('tankFill').style.height = pct + '%';
  }
  if ('soil' in d) {
    let v = d.soil;
    // raw analog reading (0-1023): higher = drier
    if (v > 100) v = 100 - (clamp(v, 0, 1023) / 1023) * 100;
    v = clamp(v);
    const s = v < 30 ? ['Dry', '#e53935'] : v < 70 ? ['Moist – Ideal', '#43a047'] : ['Wet', '#1e88e5'];
    setCard('soil', v.toFixed(0), v, s[0], s[1]);
  }
}

/* ---------- Demo mode ---------- */
function startDemo() {
  let n = 0;
  setStatus(true, 'Demo mode');
  $('btnConnect').disabled = true;
  $('btnDisconnect').disabled = false;
  $('btnDemo').textContent = 'Stop Demo';
  addLine('Demo mode started – simulated data', 'sys');
  demoTimer = setInterval(() => {
    n++;
    const t = 28 + 4 * Math.sin(n / 8) + Math.random();
    const h = 60 + 12 * Math.sin(n / 11) + Math.random() * 2;
    const dist = 40 + 25 * Math.sin(n / 14) + Math.random();
    const s = 50 + 25 * Math.sin(n / 17);
    handleLine(`T:${t.toFixed(1)},H:${h.toFixed(1)},D:${dist.toFixed(1)},S:${s.toFixed(0)}`);
  }, 1000);
}
function stopDemo() {
  if (!demoTimer) return;
  clearInterval(demoTimer); demoTimer = null;
  $('btnDemo').textContent = 'Demo';
  setStatus(false, 'Disconnected');
  addLine('Demo mode stopped', 'sys');
}

/* ---------- Native (Android OTG) callbacks ---------- */
window.onSerialData = line => { if (line && line.trim()) handleLine(line.trim()); };
window.onSerialStatus = (on, msg, isErr) => {
  setStatus(on, on ? 'Connected @ ' + $('baud').value : 'Disconnected');
  addLine(msg, isErr ? 'err' : 'sys');
};

/* ---------- Events ---------- */
$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = () => demoTimer ? stopDemo() : disconnect();
$('btnDemo').onclick = () => demoTimer ? stopDemo() : (port ? addLine('Disconnect first to use demo', 'err') : startDemo());
$('btnClear').onclick = () => { log.innerHTML = ''; };
$('sendForm').onsubmit = e => {
  e.preventDefault();
  const v = $('sendText').value;
  if (v !== '') { sendText(v); $('sendText').value = ''; }
};
$('btnConnect').disabled = !(NATIVE || 'serial' in navigator);
addLine(NATIVE ? 'Ready. Plug in your Arduino with an OTG cable, then tap Connect.' : 'Ready. Choose a baud rate and click Connect (or try Demo).', 'sys');
</script>
</body>
</html>
